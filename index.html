<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="theme-color" content="#000000" />
		<link rel="icon" href="/logo512.ico" />
		<link rel="apple-touch-icon" href="/logo192.png" />
		
		
		<!--
		Root-absolute URLs ("/fonts/...") resolve to files in the `public/`
		folder, which Vite copies verbatim into the build output root.
		-->


		<title>my website</title>
		<meta name="description" content="My personal website with some interesting info and posts"/>
		<script>
			// Unlisted pages are intentionally absent from navigation and ask search
			// engines not to index them before the React application loads.
			(function () {
				const page = new URLSearchParams(window.location.search).get('p');
				if (page === 'unlisted_relagram') {
					window.location.replace('/?p=thoughts&thought=001');
					return;
				}
				if (page === 'unlisted_brainfuck') {
					const robots = document.createElement('meta');
					robots.name = 'robots';
					robots.content = 'noindex, nofollow, noarchive';
					document.head.appendChild(robots);
				}
			})();
		</script>


		<!--
		--------------------------------------------------------------------
		------------------- PRELOAD ----------------------------------------
		--------------------------------------------------------------------
		-->

		<!-- Preload the critical self-hosted fonts: Inter Tight 400 for body
		     text and Space Mono 400 for the headline / nav.
		     crossorigin is required for font preloads. -->
		<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-tight-latin-400-normal.woff2" />
		<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/space-mono-latin-400-normal.woff2" />

		<!-- Critical @font-face declarations parse alongside the preloads. -->
		<style>
			@font-face {
				font-family: 'Inter Tight';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('/fonts/inter-tight-latin-400-normal.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Space Mono';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('/fonts/space-mono-latin-400-normal.woff2') format('woff2');
			}

			/* Metric-matched fallbacks (zero-reflow swap). ascent-override =
			   ascent/unitsPerEm, descent-override = |descent|/unitsPerEm,
			   size-adjust = real-advance-em / system-mono-advance-em. */
			@font-face {
				font-family: 'Space Mono Fallback';
				src: local('DejaVu Sans Mono'), local('Menlo'), local('Consolas'), local('Courier New');
				ascent-override: 112.00%;
				descent-override: 36.10%;
				line-gap-override: 0%;
				size-adjust: 102%;
			}
		</style>
	</head>
	<body>
		<noscript>You need to enable JavaScript to see my website. I promise not to spy over you through JS:)</noscript>
		<div id="root"></div>
		<script type="module" src="/src/index.tsx"></script>
	</body>
</html>
